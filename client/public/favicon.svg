<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48" fill="none">
  <!--
    The wordmark's globe (see src/GlobeLogo.tsx), redrawn for the tab strip:
    same three meridians and flattened equator, but stroked heavier (3 rather
    than 1.6) and pulled in off the edges so the wireframe still reads at 16px.
    The stroke is COLORS.accent (#ec3013) hard-coded — a favicon cannot reach
    the theme — so it needs updating here if the accent ever changes.
  -->
  <circle cx="24" cy="24" r="21" stroke="#ec3013" stroke-width="3" />
  <ellipse cx="24" cy="24" rx="13.8" ry="21" stroke="#ec3013" stroke-width="3" />
  <ellipse cx="24" cy="24" rx="6.2" ry="21" stroke="#ec3013" stroke-width="3" />
  <ellipse cx="24" cy="24" rx="21" ry="6.7" stroke="#ec3013" stroke-width="3" />
</svg>
